<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Word Merge Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8f0;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #4a7c59;
    }

    #game-board {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-template-rows: repeat(4, 100px);
      gap: 10px;
      margin-top: 20px;
    }

    .tile {
      width: 100px;
      height: 100px;
      background-color: #d6e4d6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 8px;
      color: #2e4d2c;
      text-align: center;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Word Merge Game</h1>
  <p>Use arrow keys to merge similar words and discover new ones.</p>
  <div id="game-board"></div>

  <script>
    const vocabProgression = [
      "Enslavement",
      "Extraction",
      "Export",
      "Manufacture",
      "Retail"
    ];

    const size = 4;
    const board = new Array(size * size).fill(null);
    const gameBoard = document.getElementById("game-board");

    function createTiles() {
      for (let i = 0; i < size * size; i++) {
        const tile = document.createElement("div");
        tile.classList.add("tile");
        tile.dataset.index = i;
        gameBoard.appendChild(tile);
      }
    }

    function addRandomTile() {
      const empty = board.map((val, i) => val === null ? i : null).filter(i => i !== null);
      if (empty.length === 0) return;
      const index = empty[Math.floor(Math.random() * empty.length)];
      board[index] = 0;
    }

    function renderBoard() {
      for (let i = 0; i < board.length; i++) {
        const tile = gameBoard.children[i];
        const val = board[i];
        tile.textContent = val !== null ? vocabProgression[val] : "";
        tile.style.backgroundColor = val !== null ? `hsl(${(val + 2) * 40}, 40%, 80%)` : "#d6e4d6";
      }
    }

    function slide(row) {
      let arr = row.filter(x => x !== null);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1] && arr[i] < vocabProgression.length - 1) {
          arr[i]++;
          arr.splice(i + 1, 1);
        }
      }
      while (arr.length < size) arr.push(null);
      return arr;
    }

    function rotate(times) {
      for (let t = 0; t < times; t++) {
        const newBoard = [];
        for (let i = 0; i < size; i++) {
          for (let j = 0; j < size; j++) {
            newBoard[j * size + (size - 1 - i)] = board[i * size + j];
          }
        }
        for (let i = 0; i < board.length; i++) board[i] = newBoard[i];
      }
    }

    function move(direction) {
      const rotations = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
      const rot = rotations[direction];
      let moved = false;

      rotate(rot);
      for (let i = 0; i < size; i++) {
        const row = board.slice(i * size, i * size + size);
        const newRow = slide(row);
        for (let j = 0; j < size; j++) {
          if (board[i * size + j] !== newRow[j]) moved = true;
          board[i * size + j] = newRow[j];
        }
      }
      rotate((4 - rot) % 4);

      if (moved) {
        addRandomTile();
        renderBoard();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
        move(e.key);
      }
    });

    createTiles();
    addRandomTile();
    addRandomTile();
    renderBoard();
  </script>
</body>
</html>
